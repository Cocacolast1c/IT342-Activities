<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Contact</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e9ecef;
        }
        header {
            background-color: #343a40;
            color: white;
            padding: 10px 20px;
            margin-bottom: 20px;
        }
        header h2 {
            margin: 0;
        }
        .card {
            padding: 20px;
            border-radius: 10px;
        }
        .container > .btn {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<header>
    <div class="container d-flex justify-content-between align-items-center">
        <h2>Edit Contact</h2>
        <a href="/logout" class="btn btn-light btn-sm">Logout</a>
    </div>
</header>


<div class="container mt-4">

    <div class="card shadow-sm bg-white">
        <div class="card-body">
            <h4 class="card-title text-center mb-4">Update Contact Information</h4>

            <div th:with="localContact=${contact}">
                <form th:action="@{/contacts/edit/submit}" method="post">
                    <input type="hidden" name="resourceName" th:value="${resourceName}">

                    <div class="mb-3">
                        <label for="givenName" class="form-label">First Name</label>
                        <input type="text" class="form-control" id="givenName" name="givenName"
                               th:value="${localContact.names[0].givenName}" required>
                    </div>

                    <div class="mb-3">
                        <label for="familyName" class="form-label">Last Name</label>
                        <input type="text" class="form-control" id="familyName" name="familyName"
                               th:value="${localContact.names[0].familyName}" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email"
                               th:value="${#lists.isEmpty(localContact.emailAddresses) ? '' : localContact.emailAddresses[0].value}">
                    </div>

                    <div class="mb-3">
                        <label for="phoneNumber" class="form-label">Phone Number</label>
                        <input type="tel" class="form-control" id="phoneNumber" name="phoneNumber"
                               th:value="${#lists.isEmpty(localContact.phoneNumbers) ? '' : localContact.phoneNumbers[0].value}">
                    </div>

                    <div class="text-end mt-4">
                        <a href="/contacts" class="btn btn-secondary me-2">Cancel</a>
                        <button type="submit" class="btn btn-primary">Update Contact</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
