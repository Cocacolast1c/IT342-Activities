<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Contacts</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" />
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e9ecef;
        }
        header {
            background-color: #343a40;
            color: white;
            padding: 10px 20px;
            margin-bottom: 20px;
        }
        header h2 {
            margin: 0;
        }
        .card {
            padding: 20px;
            border-radius: 10px;
        }
        .container > .mb-4,
        .container > button,
        .container > .table {
            margin-bottom: 30px;
        }
    </style>
</head>
<body>

<header>
    <div class="container d-flex justify-content-between align-items-center">
        <h2>Google Contacts</h2>
        <a href="/logout" class="btn btn-light btn-sm">Logout</a>
    </div>
</header>

<div class="container">

    <div class="card mb-4 bg-white shadow-sm d-flex align-items-center flex-row">
    <div>
        <h4 class="mb-2">Welcome,
            <strong th:text="${user['name']} != null ? ${user['name']} : 'Guest'"></strong>!
        </h4>
        <p class="mb-0">
            Email: <span th:text="${user['email']} != null ? ${user['email']} : 'N/A'"></span>
        </p>
    </div>
        <button type="button" class="btn btn-success ms-auto" data-bs-toggle="modal" data-bs-target="#addContactModal">
            Add Contact
        </button>
    </div>



    <div class="modal fade" id="addContactModal" tabindex="-1" aria-labelledby="addContactModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addContactModalLabel">Add New Contact</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form action="/contacts/create" method="POST">
                        <div class="mb-3">
                            <label for="givenName" class="form-label">First Name</label>
                            <input type="text" class="form-control" id="givenName" name="givenName" required>
                        </div>
                        <div class="mb-3">
                            <label for="familyName" class="form-label">Last Name</label>
                            <input type="text" class="form-control" id="familyName" name="familyName" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" name="email">
                        </div>
                        <div class="mb-3">
                            <label for="phoneNumber" class="form-label">Phone Number</label>
                            <input type="tel" class="form-control" id="phoneNumber" name="phoneNumber">
                        </div>
                        <div class="text-end">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                            <button type="submit" class="btn btn-primary">Save</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="card bg-white shadow-sm">
        <table class="table table-bordered table-striped">
            <thead class="table-dark">
            <tr>
                <th>#</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Actions</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="contact, iter : ${contacts}">

                <td th:text="${iter.index + 1}"></td>

                <td>
                <span th:if="${contact.names != null and contact.names.size() > 0 and contact.names[0].displayName != null}"
                      th:text="${contact.names[0].displayName}">N/A</span>
                    <span th:unless="${contact.names != null and contact.names.size() > 0 and contact.names[0].displayName != null}">
                    N/A
                </span>
                </td>

                <td>
                <span th:if="${contact.emailAddresses != null and contact.emailAddresses.size() > 0 and contact.emailAddresses[0].value != null}"
                      th:text="${contact.emailAddresses[0].value}">N/A</span>
                    <span th:unless="${contact.emailAddresses != null and contact.emailAddresses.size() > 0 and contact.emailAddresses[0].value != null}">
                    N/A
                </span>
                </td>

                <td>
                <span th:if="${contact.phoneNumbers != null and contact.phoneNumbers.size() > 0 and contact.phoneNumbers[0].value != null}"
                      th:text="${contact.phoneNumbers[0].value}">N/A</span>
                    <span th:unless="${contact.phoneNumbers != null and contact.phoneNumbers.size() > 0 and contact.phoneNumbers[0].value != null}">
                    N/A
                </span>
                </td>

                <td>
                    <form th:action="@{/contacts/edit}" method="get" style="display:inline;">
                        <input type="hidden" name="resourceName" th:value="${contact.resourceName}" />
                        <button type="submit" class="btn btn-primary btn-sm">Edit</button>
                    </form>

                    <form th:action="@{/contacts/delete}" method="post" style="display:inline;">
                        <button type="submit" class="btn btn-danger btn-sm"
                                th:attr="data-resourceName=${contact.resourceName}"
                                name="resourceName" th:value="${contact.resourceName}">
                            Delete
                        </button>
                    </form>
                </td>

            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
